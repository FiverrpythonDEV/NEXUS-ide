name: Build Linux Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libfuse2 fakeroot || sudo apt-get install -y libfuse2 fakeroot

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build & Package Desktop App (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --config.directories.output=release --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ide-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.zip
